[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DON_REAL_HARDWARE
    -std=gnu++17
    -DBOARD_HAS_PSRAM
board_build.flash_size = 16MB
board_build.psram_type = opi

[env:native]
platform = native
build_flags =
    -std=c++17
    -DNATIVE_BUILD
src_filter =
    +<*>
    -<platform/EspLauncher.hpp>
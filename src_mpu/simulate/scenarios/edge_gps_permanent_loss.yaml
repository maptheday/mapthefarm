name: 'Edge Case: Permanent GPS Loss'
version: 1
author: 'Zach'

# ============================================================
# Isolated on purpose: this deliberately never recovers GPS fix,
# which is a different code path than the "blip" tested inside
# full_flight_test.yaml (that one restores fix and continues the
# mission). Here we prove GPS_LOSS_ABORT_MS (3000ms) with no
# recovery forces LANDING directly -- explicitly skipping RTL,
# per checkCoreFailsafes()'s early return.
# ============================================================

steps:
  - wait-serial: '[WEB] Server started.'
  - delay: 500ms

  - write-serial: "ALT:0\n"
  - write-serial: "HDG:090.0\n"
  - write-serial: "LAT:36.123456\n"
  - write-serial: "LON:-80.123456\n"
  - write-serial: "FIX:1\n"
  - delay: 500ms

  - write-serial: "CRSFSTART:1\n"
  # REMOVED: delay: 5500ms
  - wait-serial: '[NAV] Takeoff altitude reached, transitioning to HOLD.'

  # Kill the fix and never restore it. GPS_LOSS_ABORT_MS = 3000ms.
  # wait-serial will natively block and wait for the timeout to elapse.
  - write-serial: "FIX:0\n"
  # REMOVED: delay: 3800ms
  - wait-serial: '[SAFETY] GPS fix lost — aborting directly to LANDING.'

  # Should go straight to LANDING/LANDED -- NOT through RTL. If
  # '[RTL]' shows up in the log for this run, that's a regression;
  # check_log.py flags any RTL line here as a hard failure (see
  # expected/edge_gps_permanent_loss.expected.txt).
  - write-serial: "ALT:0\n"
  # REMOVED: delay: 500ms
  - wait-serial: '[NAV] Landed — motors disarmed.'
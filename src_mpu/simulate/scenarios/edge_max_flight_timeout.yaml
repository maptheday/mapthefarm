name: 'Edge Case: Max Flight Time Timeout'
version: 1
author: 'Zach'

# ============================================================
# Isolated on purpose: needs MAX_FLIGHT_TIME_MS to actually elapse,
# and would out-time-budget the other scenarios if merged in.
#
# NOTE: this only works because MAX_FLIGHT_TIME_MS is shortened to
# 20s under a WOKWI_SIM build (see ESP32_MPU_6050_Web_Server.ino).
# The real firmware (non-WOKWI_SIM build) keeps the real 5-minute
# limit -- this scenario is only valid against a WOKWI_SIM build,
# never flash a WOKWI_SIM build to real hardware.
# ============================================================

steps:
  - wait-serial: '[WEB] Server started.'
  - delay: 500ms

  - write-serial: "ALT:0\n"
  - write-serial: "HDG:090.0\n"
  - write-serial: "LAT:36.123456\n"
  - write-serial: "LON:-80.123456\n"
  - write-serial: "FIX:1\n"
  - delay: 500ms

  - write-serial: "CRSFSTART:1\n"
  - delay: 5500ms
  - wait-serial: '[NAV] Takeoff altitude reached, transitioning to HOLD.'

  # Just sit in HOLD (armedAtMs was set back at takeoff) until
  # MAX_FLIGHT_TIME_MS (20s in sim) elapses.
  - delay: 15000ms
  - wait-serial: '[SAFETY] Max flight time reached — forcing RTL.'

  # Same altitude-injection trick as edge_geofence_breach.yaml --
  # drive baroAltitudeFt manually so RTL_CLIMB's real-sensor check
  # can actually complete in sim.
  - write-serial: "ALT:20\n"
  - delay: 300ms
  - write-serial: "ALT:40\n"
  - delay: 300ms
  - write-serial: "ALT:61\n"
  - wait-serial: '[RTL] Climb complete. Returning to launch.'

  # Already at launch coords (never moved) -- RTL_RETURN should
  # register arrival on its very next tick.
  - wait-serial: '[RTL] Arrived over launch pad. Settling.'
  - write-serial: "ALT:0\n"
  - wait-serial: '[RTL] Settle complete. Beginning landing.'

  - wait-serial: '[NAV] Landed — motors disarmed.'

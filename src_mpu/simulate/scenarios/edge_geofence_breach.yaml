name: 'Edge Case: Geofence Breach'
version: 1
author: 'Zach'

# ============================================================
# Isolated on purpose: forcing RTL here would collide with the
# waypoint-mission assertions in full_flight_test.yaml if run in
# the same boot (RTL takes over navTick/physicsTick and never
# returns to MISSION).
#
# GEOFENCE_RADIUS_M = 150. We arm, hold, then teleport the GPS fix
# ~400m north in one jump -- WAY past the geofence -- and confirm
# it's caught immediately and forces RTL.
#
# RTL_CLIMB's exit condition checks the REAL sensed altitude
# (baroAltitudeFt >= RTL_ALTITUDE_FT - 2.0). Since the sim's BME280
# is fixed-value (see README), we drive baroAltitudeFt manually via
# ALT: to let RTL_CLIMB actually complete instead of hanging forever.
# ============================================================

steps:
  - wait-serial: '[WEB] Server started.'
  - delay: 500ms

  - write-serial: "ALT:0\n"
  - write-serial: "HDG:090.0\n"
  - write-serial: "LAT:36.123456\n"
  - write-serial: "LON:-80.123456\n"
  - write-serial: "FIX:1\n"
  - delay: 500ms

  - write-serial: "CRSFSTART:1\n"
  # REMOVED: delay: 5500ms 
  - wait-serial: '[NAV] Takeoff altitude reached, transitioning to HOLD.'

  # ~400m north of launch -- well outside GEOFENCE_RADIUS_M (150m).
  # 1 degree latitude =~ 111,111m, so 0.0036 deg =~ 400m.
  - write-serial: "LAT:36.127056\n"
  # REMOVED: delay: 500ms
  - wait-serial: '[SAFETY] Geofence exceeded — forcing RTL.'

  # Simulate the climb-out: manually ramp baroAltitudeFt up to
  # RTL_ALTITUDE_FT (60ft) so RTL_CLIMB's real-sensor check can pass.
  - write-serial: "ALT:20\n"
  - delay: 300ms
  - write-serial: "ALT:40\n"
  - delay: 300ms
  - write-serial: "ALT:61\n"
  # REMOVED: delay: 500ms
  - wait-serial: '[RTL] Climb complete. Returning to launch.'

  # Fly the (simulated) GPS back toward the launch point so RTL_RETURN
  # can register arrival. Launch was (36.123456, -80.123456).
  - write-serial: "LAT:36.125000\n"
  - write-serial: "LAT:36.123500\n"
  - write-serial: "LAT:36.123456\n"
  - wait-serial: '[RTL] Arrived over launch pad. Settling.'

  - write-serial: "ALT:0\n"
  - wait-serial: '[RTL] Settle complete. Beginning landing.'
  - wait-serial: '[NAV] Landed — motors disarmed.'

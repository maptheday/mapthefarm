# simulate/scenarios/wind_gust.yaml
name: 'Wind Gust Test'
version: 1
author: 'Zach'

# ============================================================
# What are we simulating?
#
# Your drone has 4 motors, each spinning a propeller like a top.
# Spinning tops resist being tilted — that's gyroscopic force.
# To cancel out each motor's gyroscopic force, diagonal pairs
# spin in opposite directions:
#
#      FRONT
#  M1 ←    → M2
#  M3 →    ← M4
#      REAR
#
# When all 4 are balanced, the gyroscopic forces cancel and
# the drone hovers stable. The MPU6050 sits in the middle and
# measures any rotation that BREAKS that balance.
#
# The MPU6050 has three axes — picture this from behind the drone:
#
#         Z (flat compass lying on a table at the top of the grid)
#         ↑
#         |
#         |        X (thin paper standing vertical, spine pointing
#         |       ↗   straight forward away from you — nose axis)
#         |      ↗
#         +-----→  Y (thin paper standing vertical, spine pointing
#                     out the right side of the drone — roll axis)
#
#   X axis — piece of paper standing upright, pointing forward.
#             When the nose pitches up, that paper tilts back toward you.
#             When the nose pitches down, it tilts away from you.
#
#   Y axis — same piece of paper, rotated 90 degrees, pointing right.
#             When the drone rolls left, that paper tilts left.
#             When it rolls right, it tilts right.
#
#   Z axis — compass lying flat on top of the grid like a table.
#             When the drone yaws (spins left or right without tilting),
#             that flat compass needle rotates around.
#
# All three work the same way — each one owns one direction of movement
# and measures how fast its needle is sweeping in degrees per second.
# A gentle wobble is 2-3 deg/sec. A full flip blasts past 90, 180, 270.
# They don't care how far the needle goes — just how fast it's moving.
#
# When hovering flat:
#   accelZ = 1.0  (gravity pulls straight down, full force through Z)
#   accelX = 0.0  (no gravity pulling forward or backward)
#   accelY = 0.0  (no gravity pulling left or right)
#
# Two sensors inside the MPU6050:
#
#   Accelerometer — feels which way gravity is pulling.
#     Like 4 table legs — when level, all 4 take equal weight.
#     When the drone tips forward, gravity shifts from Z into X.
#     The front legs take more weight, the rear legs take less.
#     accelZ drops slightly, accelX rises — that's the tilt.
#
#   Gyroscope — feels how fast the balance is breaking.
#     Each axis has its own needle (X paper, Y paper, Z compass).
#     In normal flight all three needles sit perfectly still at 0.
#     When wind hits and tips the nose up, the X paper starts
#     tilting back toward you. The gyroscope measures how fast
#     that paper is tilting — not where it ends up, just the speed.
#
# The PID sees both — how far it's tipped (accelerometer)
# and how fast it's tipping (gyroscope) — then speeds up
# the rear motors to push the nose back down to level.
#
# ── THE WOKWI LIMITATION ───────────────────────────────────
#
# In real life, the PID corrects the motors, the drone physically
# moves, and the sensors automatically update to reflect the new
# position. The loop closes itself:
#
#   Real life: motors correct → drone moves → sensors update automatically
#   Wokwi:     motors correct → nothing moves → WE update sensors manually
#
# Wokwi has no physics engine. When the PID spins the rear motors
# faster to push the nose down, nothing actually moves in the sim.
# The accelerometer just keeps reporting whatever we last set it to.
# If we set accelX=2.5 and never change it back, Madgwick keeps
# seeing a sideways gravity vector forever — the drone thinks it's
# still tilted even while the PID is "correcting."
#
# So this scenario is split into two acts:
#
#   ACT 1 — WATCH THE PID RESPOND
#     We set the gust, then immediately reset the sensors back to level.
#     Now the PID has something real to fight — it sees the tilt angle
#     that built up during the gust and tries to unwind it.
#     Watch pitch creeping back toward 0 and motor outputs changing.
#     This proves the PID logic is correct.
#
#   ACT 2 — ACKNOWLEDGE THE LIMITATION
#     In a real physics sim, pitch would eventually reach 0 and the
#     motors would return to balanced. Here, we just let it run until
#     we've seen enough to trust the PID is working, then the
#     scenario ends. The drone never fully "lands" — we just stop watching.
#
# ── INTEGRAL WINDUP AND THE INSTANT LEVEL ──────────────────
#
# When we manually reset the sensors to level, the weird part is
# the drone "levels out" instantly — like teleporting from tilted
# to flat with no gradual recovery. That doesn't happen in real life.
#
# In real life, the motors correct gradually, the drone physically
# tips back toward level degree by degree, and the sensors update
# as it goes. The PID's integral — its memory of how long it's been
# fighting the tilt — unwinds naturally during that gradual recovery.
#
# Here in Wokwi, we skip the gradual part. The sensors snap back
# to level instantly, but the integral still remembers the tilt.
# So the PID keeps fighting something that no longer exists in the
# sensors — you'll see pitchCorr slowly bleed back toward 0 as the
# integral unwinds even though pitch is already recovering.
#
# This is actually realistic behavior for the math — just not the
# physics. The integral windup and unwind you see here is exactly
# what would happen on real hardware after a gust. The difference
# is on real hardware the drone would physically wobble slightly
# as the integral overshoots and corrects back — called ringing.
# In Wokwi you just see the numbers, not the wobble.
#
# ============================================================

steps:
  # Wait for everything to boot and calibrate
  - wait-serial: '[BARO] BME280 ready.'
  - wait-serial: '[Web] Server started.'
  - delay: 5000ms

  # ── ACT 1: GUST HITS ───────────────────────────────────────
  #
  # Wind hits the front of the drone and pushes the nose up.
  # M1 (FL) and M2 (FR) get pushed upward.
  # M3 (RL) and M4 (RR) stay put.
  # The 4-motor balance breaks — gravity is no longer
  # pulling equally through all 4 legs of the table.
  # Gravity shifts from Z (straight down) into X (forward/back).

  # Gravity now has a forward component — the front is rising
  # so the accelerometer feels weight shifting toward the rear.
  # Like the table tilting and the rear legs taking more weight.
  - set-control:
      part-id: mpu
      control: accelX
      value: 2.5

  # Z axis weakens — gravity is no longer pulling purely straight
  # down through the center. Some of it shifted into X.
  # Total gravity is still 1g, just split between two axes now.
  - set-control:
      part-id: mpu
      control: accelZ
      value: 0.97

  # The X paper starts tilting back toward you — the nose is
  # pitching up at 10 deg/sec from the wind push. Like a door
  # being shoved hard open. The gyroscope measures how fast
  # that paper is tilting, not where it ends up.
  - set-control:
      part-id: mpu
      control: rotationX
      value: 10

  # Gust lasts 2 seconds — short and sharp like a real wind burst.
  # During this time, Madgwick is integrating the rotation into
  # a tilt angle. That angle is what the PID will fight next.
  - delay: 2000ms

  # ── WOKWI MANUAL RESET ─────────────────────────────────────
  #
  # This is where we "play physics" manually.
  # In real life, once the gust stops the drone is physically tilted
  # and the sensors would naturally reflect that tilt.
  # In Wokwi, we have to explicitly tell the sensors the gust stopped.
  # We reset them to level so Madgwick stops seeing a sideways gravity
  # vector — otherwise it would never let the pitch angle unwind.
  #
  # Think of it like pausing a movie after the gust hits,
  # manually updating the set to show the drone tilted,
  # then pressing play again to watch the PID respond.
  # It's not perfect physics — it's controlled storytelling.
  #
  # NOTE: The drone levels out instantly here — like teleporting
  # from tilted to flat. That's the Wokwi limitation. In real life
  # it would tip back gradually as the motors physically push it.
  # The integral math is still correct — just missing the wobble.

  # X paper stops tilting — the push stopped
  - set-control:
      part-id: mpu
      control: rotationX
      value: 0

  # Gravity goes back to pulling straight down —
  # we're telling Wokwi "the gust is over, sensors back to normal"
  - set-control:
      part-id: mpu
      control: accelX
      value: 0

  # Full gravity through Z again — all 4 table legs level
  - set-control:
      part-id: mpu
      control: accelZ
      value: 1

  # ── ACT 2: WATCH THE PID RECOVER ──────────────────────────
  #
  # Now the sensors are back to level but Madgwick still remembers
  # the tilt angle that built up during the gust — that's the
  # integral memory inside the filter. The PID sees that residual
  # tilt and starts correcting. Watch the serial output:
  #
  #   pitch creeping back toward 0    = X paper returning to upright
  #   pitchCorr climbing              = PID fighting harder each loop
  #   m3/m4 rising, m1/m2 dropping   = rear motors correcting the tilt
  #
  # In a real physics sim this loop would close completely —
  # motors correct, drone levels, sensors confirm level, PID relaxes.
  # Here we just watch long enough to trust the PID is doing the
  # right thing, then the scenario ends. Good enough to ship.
  - delay: 30000ms
[wokwi]
version = 1
firmware = '../.pio/build/wokwi_sim/firmware.bin'
elf = '../.pio/build/wokwi_sim/firmware.elf'

[network]
ssid = "Wokwi-GUEST"
password = ""

[flash]
fs = "../.pio/build/wokwi_sim/littlefs.bin"

[[chip]]
name = "bme280"
binary = "bme280.chip.wasm"

# Forward http://localhost:8180 -> the simulated ESP32's web server (port 80),
# so simulate/api_endpoint_test.sh can curl /takeoff, /rtl, /land, /stop,
# /motor-test etc. against a live sim instead of just watching serial output.
[[net.forward]]
from = "localhost:8180"
to = "target:80"

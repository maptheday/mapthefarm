[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
	Adafruit MPU6050
	Adafruit Unified Sensor
	ArduinoJson
	arduino-libraries/Madgwick
	adafruit/Adafruit BME280 Library@^2.3.0
	mikalhart/TinyGPSPlus@^1.0.3
	mprograms/QMC5883LCompass@^1.2.2

; ── Simulation build — the WHOLE simulation runs ON the ESP. The QuadSim library
;    (lib/QuadSim) provides the physics right inside the 200 Hz flight loop, so
;    the real flight controller flies against real physics at the real rate: one
;    clock, no laptop, no serial in the loop. It flies the field autonomously and
;    logs the flight to LittleFS; pull it back with the DUMPLOG serial command
;    (see simulate/pull_onboard_log.py). One flag, -DSIM, is the only difference
;    from a real-hardware build. ──
[env:sim]
extends = env:esp32dev
build_flags =
	-DSIM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
upload_protocol = esptool
monitor_port = /dev/tty.usbmodem14101
upload_port = /dev/tty.usbmodem14101

; ============================================================================
; One build per APP. The flight controller (src/flight) is shared by all of
; them and has no settings or test modes of its own; each app (src/apps/*)
; decides what to run. Flash an app with:
;
;     pio run -e <app> -t upload
;
; Settings live in data/flightsettings.json, plus override files layered on
; top by some apps (like appsettings.Development.json in .NET):
;     flightsettings/first_mission.json   the first_mission app's short route
;     flightsettings/sim.json              the sim app's changes
;     flightsettings/sim.<scenario>.json   one sim scenario's changes
; Put the whole data/ folder on the drone (once, and again whenever you
; change a file) with:
;
;     pio run -e fly -t uploadfs
;
; Apps:
;   fly                  the real flight program
;   bench_test           props OFF: spin one motor at a time, stream the sensors
;   esc_calibration      props OFF: teach the ESCs the throttle range (once)
;   compass_calibration  outdoors: rotate the drone to calibrate the compass (once)
;   first_mission        the real flight program, with flightsettings/first_mission.json
;                        layered on top: a short 30 m out-and-back mission
;   sim                  on-chip simulation: fake physics feeds the real flight
;                        controller; driven by simulate/run_hil.sh
; ============================================================================

[env]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
	Adafruit MPU6050
	Adafruit Unified Sensor
	ArduinoJson
	arduino-libraries/Madgwick
	adafruit/Adafruit BME280 Library@^2.3.0
	mikalhart/TinyGPSPlus@^1.0.3
	mprograms/QMC5883LCompass@^1.2.2

[env:fly]
build_src_filter = +<flight/> +<apps/fly/>

[env:bench_test]
build_src_filter = +<flight/> +<apps/bench_test/>

[env:esc_calibration]
build_src_filter = +<flight/> +<apps/esc_calibration/>

[env:compass_calibration]
build_src_filter = +<flight/> +<apps/compass_calibration/>

[env:first_mission]
build_src_filter = +<flight/> +<apps/first_mission/>

; The whole simulation runs ON the ESP: the QuadSim library (lib/QuadSim)
; provides the physics right inside the 200 Hz flight loop, and the sim app
; feeds the flight controller fake sensors through the same FlightIo API the
; real sensors use. The native-USB flags let the laptop talk to it over the
; USB-C port.
[env:sim]
build_src_filter = +<flight/> +<apps/sim/>
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
upload_protocol = esptool
monitor_port = /dev/tty.usbmodem14101
upload_port = /dev/tty.usbmodem14101

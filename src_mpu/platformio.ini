[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps = 
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
	Adafruit MPU6050
	Adafruit Unified Sensor
	ArduinoJson
	arduino-libraries/Madgwick
	adafruit/Adafruit BME280 Library@^2.3.0
	mikalhart/TinyGPSPlus@^1.0.3
	mprograms/QMC5883LCompass@^1.2.2

; ── Simulation build — real hardware libs still compile in,
;    but WOKWI_SIM routes sensor reads to injected values instead ──
[env:wokwi_sim]
extends = env:esp32dev
build_flags =
	-DWOKWI_SIM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
upload_protocol = esptool
monitor_port = /dev/tty.usbmodem14101
upload_port = /dev/tty.usbmodem14101
